[project]
name = "onedesk"
authors = [{ name = "One", email = "hello@4dl.app" }]
description = "One — every One product, as modules on the Frappe desk"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = [
    # WebAuthn registration and assertion verification. BSD-3, and the
    # alternative is writing CBOR parsing and COSE key handling ourselves,
    # which is security-critical code with no reason to be ours.
    "webauthn>=2.0,<4",
    # WebDAV, for OneCloud as a network drive (one_cloud/dav.py). MIT, and
    # the protocol's XML, locking and client quirks are a solved problem.
    "wsgidav>=4.3,<5",
    # SFTP, for a server shown as a folder (one_cloud/mounts.py). LGPL-2.1,
    # used as a library, which is what its licence is written for.
    "paramiko~=3.4",
    # Web Push, for a notification on a person's devices (one/push.py).
    # MPL-2.0, used as a library: RFC 8291 encryption and VAPID signing are
    # security-critical and a solved problem.
    "pywebpush>=2,<3",
    # S3-compatible storage, for each workspace's files on R2
    # (one_admin/storage.py). Apache-2.0.
    "boto3>=1.34,<2",
    # Word files, for a document on the network drive, through a link and
    # in mail (one_doc/word.py). MIT; writing OOXML by hand is a solved
    # problem we would only be re-solving.
    "python-docx>=1.1,<2",
    # Word files read back as HTML (one_doc/word.py). BSD-2; the same
    # converter Suite's writer runs in the browser.
    "mammoth>=1.8,<2",
    # PowerPoint files, for a presentation exported to be edited elsewhere
    # (one_deck/powerpoint.py). MIT; writing PresentationML by hand is a
    # solved problem we would only be re-solving.
    "python-pptx>=1.0,<2",
    # XML read safely, for a news feed on a screen (one_display/sources.py).
    # PSF; entity expansion is a solved problem we would only be re-solving.
    "defusedxml>=0.7,<1",
    # libsodium's sealed box, for an Actions secret written to the
    # repository (one_admin/github_app.py). Apache-2.0, and already here
    # through paramiko; GitHub takes a secret sealed no other way.
    "pynacl>=1.5,<2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"
hrms = ">=17.0.0-dev,<18.0.0"

[tool.bench.dev-dependencies]
pytest-xdist = "~=3.8"

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "RUF001",
    "RUF002",
    "RUF003",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
