<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if rtl else 'ltr' }}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>OneDisplay</title>
	<link rel="icon" href="/assets/onedesk/images/one.svg">
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #fff; }
		:root { --accent: {{ accent }}; }
		body { font-family: "Inter", "Noto Sans", "Noto Sans Arabic", Tahoma, Arial, sans-serif; cursor: none; -webkit-font-smoothing: antialiased; }
		.hidden { display: none !important; }
		.fill { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

		/* The frame is drawn at 1920 by 1080 (or 1080 by 1920) and scaled to the screen whole. */
		#frame { position: absolute; top: 0; left: 0; overflow: hidden; background: #0b0d10; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
		#slides > div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; opacity: 1; -webkit-transition: opacity 0.8s ease, -webkit-transform 0.8s ease; transition: opacity 0.8s ease, transform 0.8s ease; }
		#slides > div.out { opacity: 0; }
		#slides > div.ahead { -webkit-transform: translateX(100%); transform: translateX(100%); }
		#slides img, #slides video { width: 100%; height: 100%; display: block; }
		#slides iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
		.cover { object-fit: cover; }
		.contain { object-fit: contain; }
		#widgets > .w { position: absolute; overflow: hidden; box-sizing: border-box; }

		/* Widgets size their words in em from their own height and draw nothing
		   around them: a box's fill, border, corners and padding are its look (tv.js dress). */
		.panel { height: 100%; box-sizing: border-box; }
		.eyebrow { font-size: 0.7em; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.7; margin-bottom: 0.6em; }
		.now { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: baseline; align-items: baseline; padding: 0.5em 0.7em; border-radius: 0.3em; margin-bottom: 0.5em; }
		.now .t { font-size: 3em; font-weight: 700; line-height: 1.05; -webkit-flex: 1 0 auto; flex: 1 0 auto; }
		.now .c { font-size: 1.3em; white-space: nowrap; }
		.fresh { -webkit-animation: flash 1s ease-in-out 3; animation: flash 1s ease-in-out 3; }
		@-webkit-keyframes flash { 50% { opacity: 0.35; } }
		@keyframes flash { 50% { opacity: 0.35; } }
		.row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0.35em 0.2em; border-bottom: 0.04em solid rgba(255, 255, 255, 0.12); }
		.row .t { -webkit-flex: 1; flex: 1; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
		.row .c { opacity: 0.8; -webkit-margin-start: 0.6em; margin-inline-start: 0.6em; white-space: nowrap; }
		.row img { width: 2em; height: 2em; object-fit: cover; border-radius: 0.2em; -webkit-margin-end: 0.6em; margin-inline-end: 0.6em; }
		.row .sub { display: block; font-size: 0.7em; font-weight: 400; opacity: 0.75; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
		.pill { display: inline-block; min-width: 1.6em; text-align: center; padding: 0.15em 0.3em; border-radius: 0.25em; background: rgba(255, 255, 255, 0.14); font-weight: 700; -webkit-margin-end: 0.6em; margin-inline-end: 0.6em; }
		.big { font-weight: 700; line-height: 1; }
		.ticker { height: 100%; white-space: nowrap; overflow: hidden; position: relative; }
		.ticker span { position: absolute; top: 0; height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 0.55em; }
		.kiosk { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
		.kiosk h1 { font-size: 0.9em; font-weight: 600; margin: 0 0 0.8em; }
		.kiosk button { display: inline-block; width: 40%; margin: 0.25em 2%; padding: 0.7em 0.5em; font: inherit; font-size: 0.55em; font-weight: 600; color: #fff; border: 0; border-radius: 0.3em; cursor: pointer; }
		.kiosk.stacked button { display: block; width: 86%; margin: 0.35em auto; }
		.weather .temp { font-size: 2.4em; font-weight: 700; line-height: 1; }
		.weather svg, .icon svg { width: 2.2em; height: 2.2em; vertical-align: middle; }
		.days { display: -webkit-flex; display: flex; margin-top: 0.6em; }
		.days > div { -webkit-flex: 1; flex: 1; text-align: center; font-size: 0.7em; }
		.days svg { width: 1.6em; height: 1.6em; }
		.qr { height: 100%; text-align: center; }
		.qr svg { height: 80%; width: auto; background: #fff; border-radius: 0.2em; }
		.custom iframe { width: 100%; height: 100%; border: 0; background: transparent; }
		.tiles { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-content: flex-start; align-content: flex-start; }
		.tile { box-sizing: border-box; padding: 0.15em; }
		.tile-in { height: 100%; box-sizing: border-box; padding: 0.4em 0.55em; border-radius: 0.25em; background: rgba(255, 255, 255, 0.08); display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-between; justify-content: space-between; overflow: hidden; }
		.tile-in .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.tile-in .big { font-size: 1.5em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.tile-in .c, .single .c { font-size: 0.75em; opacity: 0.85; }
		.single { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
		.single .big { font-size: 2em; margin: 0.15em 0; white-space: nowrap; }

		/* Over the frame: pairing, sleep, dark, the alert, a kiosk's ticket, a radio. */
		#radio { background: #060912; overflow: hidden; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; font-size: 5vmin; }
		#radio .glow { position: absolute; width: 90vmin; height: 90vmin; border-radius: 50%; opacity: 0.45; -webkit-filter: blur(6vmin); filter: blur(6vmin); left: 50%; top: 50%; margin: -45vmin 0 0 -45vmin; background: radial-gradient(circle, var(--accent) 0%, rgba(37, 99, 235, 0) 65%); -webkit-animation: drift-a 18s ease-in-out infinite alternate; animation: drift-a 18s ease-in-out infinite alternate; }
		#radio .radio-in { position: relative; }
		#radio .eq { display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; -webkit-align-items: flex-end; align-items: flex-end; height: 12vmin; margin-bottom: 5vmin; }
		#radio .eq i { display: block; width: 1.6vmin; height: 100%; margin: 0 0.7vmin; border-radius: 1vmin; background: #f8fafc; -webkit-transform-origin: bottom; transform-origin: bottom; -webkit-animation: eq 1.1s ease-in-out infinite alternate; animation: eq 1.1s ease-in-out infinite alternate; }
		#radio .eq i:nth-child(2) { -webkit-animation-delay: -0.4s; animation-delay: -0.4s; }
		#radio .eq i:nth-child(3) { -webkit-animation-delay: -0.8s; animation-delay: -0.8s; }
		#radio .eq i:nth-child(4) { -webkit-animation-delay: -0.2s; animation-delay: -0.2s; }
		#radio .eq i:nth-child(5) { -webkit-animation-delay: -0.6s; animation-delay: -0.6s; }
		#radio.silent .eq i { -webkit-animation: none; animation: none; -webkit-transform: scaleY(0.12); transform: scaleY(0.12); opacity: 0.5; }
		@-webkit-keyframes eq { from { -webkit-transform: scaleY(0.15); } to { -webkit-transform: scaleY(1); } }
		@keyframes eq { from { transform: scaleY(0.15); } to { transform: scaleY(1); } }
		#radio-now { font-weight: 600; letter-spacing: -0.02em; margin-top: 1vmin; }
		.over { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
		#ticket { background: #0b0d10; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
		#ticket .a { font-size: 3vmin; color: #d1d5db; margin: 0 8vmin; }

		/* Pairing: the mark, the code in tiles, and once paired a link drawn
		   from the workspace to this screen. Transform and opacity only. */
		#pair { background: #060912; overflow: hidden; color: #f8fafc; z-index: 15; }
		#pair .glow { position: absolute; width: 90vmin; height: 90vmin; border-radius: 50%; opacity: 0.55; -webkit-filter: blur(6vmin); filter: blur(6vmin); }
		#pair .glow.a { left: -20vmin; top: -30vmin; background: radial-gradient(circle, var(--accent) 0%, rgba(37, 99, 235, 0) 65%); -webkit-animation: drift-a 22s ease-in-out infinite alternate; animation: drift-a 22s ease-in-out infinite alternate; }
		#pair .glow.b { right: -25vmin; bottom: -35vmin; background: radial-gradient(circle, #7c3aed 0%, rgba(124, 58, 237, 0) 65%); -webkit-animation: drift-b 26s ease-in-out infinite alternate; animation: drift-b 26s ease-in-out infinite alternate; }
		@-webkit-keyframes drift-a { to { -webkit-transform: translate(18vmin, 12vmin) scale(1.15); } }
		@keyframes drift-a { to { transform: translate(18vmin, 12vmin) scale(1.15); } }
		@-webkit-keyframes drift-b { to { -webkit-transform: translate(-16vmin, -10vmin) scale(1.1); } }
		@keyframes drift-b { to { transform: translate(-16vmin, -10vmin) scale(1.1); } }
		#pair .grid { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px); background-size: 6vmin 6vmin; }
		#pair .top { position: absolute; top: 5vmin; left: 6vmin; right: 6vmin; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
		#pair .brand { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 3.4vmin; letter-spacing: -0.02em; }
		#pair .brand svg { width: 6.4vmin; height: 6.4vmin; -webkit-margin-end: 1.6vmin; margin-inline-end: 1.6vmin; }
		#pair .brand .one { font-weight: 300; }
		#pair .brand .app { font-weight: 600; }
		#pair .where { font-size: 2.1vmin; color: #94a3b8; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
		#pair .where i { display: inline-block; width: 1.2vmin; height: 1.2vmin; border-radius: 50%; background: #22c55e; -webkit-margin-end: 1.2vmin; margin-inline-end: 1.2vmin; -webkit-animation: beat 2s ease-in-out infinite; animation: beat 2s ease-in-out infinite; }
		@-webkit-keyframes beat { 50% { opacity: 0.25; } }
		@keyframes beat { 50% { opacity: 0.25; } }
		#pair .stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; }
		#pair .label { font-size: 2.2vmin; letter-spacing: 0.6vmin; text-transform: uppercase; color: #94a3b8; margin-bottom: 4vmin; }
		#pair .digits { display: -webkit-flex; display: flex; direction: ltr; }
		#pair .digit { position: relative; overflow: hidden; width: 13vmin; height: 17vmin; margin: 0 1vmin; border-radius: 2.2vmin; background: rgba(255, 255, 255, 0.06); border: 0.2vmin solid rgba(255, 255, 255, 0.12); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 11vmin; font-weight: 600; font-variant-numeric: tabular-nums; -webkit-animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
		#pair .digit:nth-child(3) { -webkit-margin-end: 4vmin; margin-inline-end: 4vmin; }
		#pair .digit::after { content: ""; position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.16) 50%, rgba(255, 255, 255, 0) 100%); -webkit-transform: translateX(-150%); transform: translateX(-150%); -webkit-animation: sheen 5s ease-in-out infinite; animation: sheen 5s ease-in-out infinite; }
		@-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(4vmin) scale(0.92); } }
		@keyframes rise { from { opacity: 0; transform: translateY(4vmin) scale(0.92); } }
		@-webkit-keyframes sheen { 0%, 70% { -webkit-transform: translateX(-150%); } 100% { -webkit-transform: translateX(260%); } }
		@keyframes sheen { 0%, 70% { transform: translateX(-150%); } 100% { transform: translateX(260%); } }
		#pair .how { font-size: 2.8vmin; color: #cbd5e1; margin-top: 5vmin; }
		#pair .host { display: inline-block; margin-top: 2.2vmin; padding: 0.9vmin 2.2vmin; border-radius: 4vmin; background: rgba(255, 255, 255, 0.07); border: 0.15vmin solid rgba(255, 255, 255, 0.1); font-size: 2vmin; color: #94a3b8; direction: ltr; }
		#pair .scan { position: absolute; left: 0; right: 0; bottom: 0; height: 0.4vmin; overflow: hidden; }
		#pair .scan::after { content: ""; position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), var(--accent), rgba(255, 255, 255, 0)); -webkit-animation: scan 3s ease-in-out infinite; animation: scan 3s ease-in-out infinite; }
		@-webkit-keyframes scan { from { -webkit-transform: translateX(-100%); } to { -webkit-transform: translateX(340%); } }
		@keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
		/* paired: the code gives way to the link */
		#pair .code-part { -webkit-transition: opacity 0.6s ease, -webkit-transform 0.6s ease; transition: opacity 0.6s ease, transform 0.6s ease; }
		#pair.linking .code-part { opacity: 0; -webkit-transform: scale(0.9); transform: scale(0.9); }
		#pair .link { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; opacity: 0; -webkit-transition: opacity 0.6s ease 0.3s; transition: opacity 0.6s ease 0.3s; }
		#pair.linking .link { opacity: 1; }
		#pair .path { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; direction: ltr; }
		#pair .node { position: relative; width: 16vmin; height: 16vmin; border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 0.2vmin solid rgba(255, 255, 255, 0.14); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
		#pair .node svg { width: 8vmin; height: 8vmin; }
		#pair .node .ring { position: absolute; top: -0.2vmin; left: -0.2vmin; right: -0.2vmin; bottom: -0.2vmin; border-radius: 50%; border: 0.3vmin solid var(--accent); opacity: 0; }
		#pair.linking .node.from .ring { -webkit-animation: ring 1.6s ease-out infinite; animation: ring 1.6s ease-out infinite; }
		#pair.linked .node.to .ring { border-color: #22c55e; -webkit-animation: ring 1.2s ease-out 2; animation: ring 1.2s ease-out 2; }
		@-webkit-keyframes ring { 0% { opacity: 0.8; -webkit-transform: scale(1); } 100% { opacity: 0; -webkit-transform: scale(1.6); } }
		@keyframes ring { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
		#pair .track { position: relative; width: 44vmin; height: 0.3vmin; margin: 0 2vmin; background: rgba(255, 255, 255, 0.1); overflow: visible; }
		#pair .lane { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
		#pair .lane b { position: absolute; top: -0.75vmin; left: 0; width: 1.8vmin; height: 1.8vmin; margin-left: -0.9vmin; border-radius: 50%; background: var(--accent); box-shadow: 0 0 2vmin var(--accent); }
		#pair.linking .lane { -webkit-animation: flow 1.4s linear infinite; animation: flow 1.4s linear infinite; }
		#pair .lane:nth-child(2) { -webkit-animation-delay: 0.35s; animation-delay: 0.35s; }
		#pair .lane:nth-child(3) { -webkit-animation-delay: 0.7s; animation-delay: 0.7s; }
		#pair .lane:nth-child(4) { -webkit-animation-delay: 1.05s; animation-delay: 1.05s; }
		@-webkit-keyframes flow { 0% { opacity: 0; -webkit-transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; -webkit-transform: translateX(100%); } }
		@keyframes flow { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
		#pair .node .check { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: #16a34a; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; opacity: 0; -webkit-transform: scale(0.6); transform: scale(0.6); -webkit-transition: opacity 0.4s ease, -webkit-transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
		#pair .node .check path { stroke-dasharray: 30; stroke-dashoffset: 30; -webkit-transition: stroke-dashoffset 0.5s ease 0.25s; transition: stroke-dashoffset 0.5s ease 0.25s; }
		#pair.linked .node .check { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }
		#pair.linked .node .check path { stroke-dashoffset: 0; }
		#pair .done { margin-top: 6vmin; text-align: center; opacity: 0; -webkit-transform: translateY(2vmin); transform: translateY(2vmin); -webkit-transition: opacity 0.6s ease 0.2s, -webkit-transform 0.6s ease 0.2s; transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s; }
		#pair.linked .done { opacity: 1; -webkit-transform: none; transform: none; }
		#pair .done .t { font-size: 5.6vmin; font-weight: 600; letter-spacing: -0.02em; }
		#pair .done .s { font-size: 2.6vmin; color: #94a3b8; margin-top: 1.4vmin; }
		#pair:not(.hidden) ~ #status #hint { display: none !important; }
		#pair.leaving { opacity: 0; -webkit-transition: opacity 0.8s ease; transition: opacity 0.8s ease; }
		#ticket .t { font-size: 26vmin; font-weight: 700; line-height: 1.1; }
		#saver { background: #000; }
		#saver .drift { position: absolute; text-align: center; -webkit-transition: top 3s ease, left 3s ease; transition: top 3s ease, left 3s ease; }
		#saver .drift div { font-size: 10vmin; font-weight: 200; color: #6b7280; }
		#saver img { max-height: 8vmin; max-width: 30vmin; opacity: 0.5; }
		#dark { background: #000; z-index: 20; }
		#alert { background: #b91c1c; z-index: 30; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; padding: 0 8vmin; font-size: 7vmin; font-weight: 700; line-height: 1.25; -webkit-animation: flash 1.6s ease-in-out infinite; animation: flash 1.6s ease-in-out infinite; }
		#status { position: fixed; z-index: 40; bottom: 1.5vmin; right: 1.5vmin; font-size: 1.6vmin; color: #9ca3af; }
		#status .dot { display: inline-block; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #f59e0b; vertical-align: middle; }
	</style>
</head>
<body>
	<div id="frame">
		<div id="slides" class="fill"></div>
		<div id="widgets" class="fill"></div>
	</div>
	<div id="pair" class="over hidden">
		<div class="glow a"></div><div class="glow b"></div><div class="grid"></div>
		<div class="top code-part">
			<div class="brand">{{ mark }}<span class="one">One</span><span class="app">Display</span></div>
			<div class="where"><i></i><span id="pair-where"></span></div>
		</div>
		<div class="stage code-part">
			<div class="label" id="pair-title"></div>
			<div class="digits" id="code"></div>
			<div class="how" id="pair-how"></div>
			<div class="host" id="pair-host"></div>
		</div>
		<div class="link">
			<div class="path">
				<div class="node from">{{ mark }}<span class="ring"></span></div>
				<div class="track"><span class="lane"><b></b></span><span class="lane"><b></b></span><span class="lane"><b></b></span><span class="lane"><b></b></span></div>
				<div class="node to">
					{% if radio %}<svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><circle cx="12" cy="6.5" r="1"/></svg>{% else %}<svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>{% endif %}
					<span class="ring"></span>
					<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
				</div>
			</div>
			<div class="done"><div class="t" id="pair-done"></div><div class="s" id="pair-what"></div></div>
		</div>
		<div class="scan code-part"></div>
	</div>
	<div id="radio" class="over hidden"><div class="glow"></div><div class="radio-in"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="radio-zone" class="eyebrow"></div><div id="radio-now"></div></div></div>
	<div id="saver" class="over hidden"><div class="drift" id="drift"><div id="saver-clock"></div><img id="saver-logo" class="hidden" alt=""></div></div>
	<div id="ticket" class="over hidden">
		<div class="a" id="ticket-label"></div>
		<div class="t" id="ticket-number"></div>
