		.wl-k-wait { font-size: calc(0.75em * var(--fs-detail, 1)); opacity: 0.6; white-space: nowrap; -webkit-margin-start: 0.8em; margin-inline-start: 0.8em; }
		.wl-k-go { font-size: 1.4em; opacity: 0.45; line-height: 1; -webkit-margin-start: 0.6em; margin-inline-start: 0.6em; }
		.wl-sched { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-around; justify-content: space-around; }
		.wl-s-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0.35em 0.6em; border-radius: 0.4em; }
		.wl-s-row.past { opacity: 0.45; }
		.wl-s-row.now { background: rgba(127, 127, 127, 0.16); }
		.wl-s-time { width: 4.2em; -webkit-flex: none; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; font-size: calc(1em * var(--fs-label, 1)); }
		.wl-s-body { -webkit-flex: 1; flex: 1; min-width: 0; }
		.wl-s-what { font-weight: 700; font-size: calc(1.15em * var(--fs-main, 1)); line-height: 1.2; }
		.wl-s-where { opacity: 0.65; font-size: calc(0.8em * var(--fs-detail, 1)); }
		.wl-s-tag { -webkit-flex: none; flex: none; padding: 0.2em 0.6em; border-radius: 1em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: inset 0 0 0 0.08em currentColor; font-size: calc(0.6em * var(--fs-label, 1)); }
		.wl-s-big { font-weight: 700; line-height: 1.1; font-size: calc(2.2em * var(--fs-main, 1)); }
		.wl-s-gap { height: 0.9em; }
		.wl-open { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; }
		.wl-o-state { -webkit-align-self: flex-start; align-self: flex-start; padding: 0.25em 0.8em; border-radius: 1em; margin-bottom: 0.6em; font-weight: 700; box-shadow: inset 0 0 0 0.08em currentColor; font-size: calc(0.85em * var(--fs-label, 1)); }
		.wl-o-row { display: -webkit-flex; display: flex; padding: 0.3em 0.5em; border: 0 solid transparent; -webkit-border-start-width: 0.2em; border-inline-start-width: 0.2em; opacity: 0.75; }
		.wl-o-row.today { opacity: 1; font-weight: 700; }
		.wl-o-day { -webkit-flex: 1; flex: 1; font-size: calc(1em * var(--fs-main, 1)); }
		.wl-o-time { font-variant-numeric: tabular-nums; font-size: calc(1em * var(--fs-detail, 1)); }
		.wl-wifi { -webkit-margin-start: 0.9em; margin-inline-start: 0.9em; }
		.wl-wifi.top { margin: 0.6em 0 0; text-align: center; }
		.wl-wifi .eyebrow { margin-bottom: 0.15em; }
		.wl-w-value { font-weight: 700; margin-bottom: 0.5em; font-size: calc(1.5em * var(--fs-main, 1)); }
		.wl-caption { -webkit-margin-start: 0.8em; margin-inline-start: 0.8em; font-size: calc(1.2em * var(--fs-detail, 1)); font-weight: 600; line-height: 1.2; }
		.single { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
		.single .big { font-size: calc(2em * var(--fs-main, 1)); margin: 0.15em 0; white-space: nowrap; }

		/* Over the frame: pairing, sleep, dark, the alert, a kiosk's ticket, a radio. */
		#radio { background: #0a0a0b; overflow: hidden; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; font-size: 5vmin; }
		#radio .light { position: absolute; left: 50%; bottom: -66vmin; width: 160vmin; height: 100vmin; margin-left: -80vmin; border-radius: 50%; background: radial-gradient(closest-side, var(--accent), rgba(10, 10, 11, 0)); -webkit-animation: breathe 9s ease-in-out infinite alternate; animation: breathe 9s ease-in-out infinite alternate; }
		#radio .radio-in { position: relative; }
		#radio .eq { display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; -webkit-align-items: flex-end; align-items: flex-end; height: 12vmin; margin-bottom: 5vmin; }
		#radio .eq i { display: block; width: 1.6vmin; height: 100%; margin: 0 0.7vmin; border-radius: 1vmin; background: #f8fafc; -webkit-transform-origin: bottom; transform-origin: bottom; -webkit-animation: eq 1.1s ease-in-out infinite alternate; animation: eq 1.1s ease-in-out infinite alternate; }
		#radio .eq i:nth-child(2) { -webkit-animation-delay: -0.4s; animation-delay: -0.4s; }
		#radio .eq i:nth-child(3) { -webkit-animation-delay: -0.8s; animation-delay: -0.8s; }
		#radio .eq i:nth-child(4) { -webkit-animation-delay: -0.2s; animation-delay: -0.2s; }
		#radio .eq i:nth-child(5) { -webkit-animation-delay: -0.6s; animation-delay: -0.6s; }
		#radio.silent .eq i { -webkit-animation: none; animation: none; -webkit-transform: scaleY(0.12); transform: scaleY(0.12); opacity: 0.5; }
		@-webkit-keyframes eq { from { -webkit-transform: scaleY(0.15); } to { -webkit-transform: scaleY(1); } }
		@keyframes eq { from { transform: scaleY(0.15); } to { transform: scaleY(1); } }
		#radio-now { font-weight: 600; letter-spacing: -0.02em; margin-top: 1vmin; }
		.over { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
		#ticket { background: #0b0d10; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
		#ticket .a { font-size: 3vmin; color: #d1d5db; margin: 0 8vmin; }

		/* Pairing, set like a page of type: the mark, a headline, the code in
		   large figures and a code a phone scans. One faint light in the
		   brand's colour. Once paired, one tick and the screen's name.
		   Transform and opacity only. */
		#pair { background: #0a0a0b; color: #fafafa; overflow: hidden; z-index: 15; font-feature-settings: "tnum" 1, "cv11" 1; }
		#pair .light { position: absolute; left: 50%; bottom: -66vmin; width: 160vmin; height: 100vmin; margin-left: -80vmin; border-radius: 50%; background: radial-gradient(closest-side, var(--accent), rgba(10, 10, 11, 0)); opacity: 0.22; -webkit-animation: breathe 9s ease-in-out infinite alternate; animation: breathe 9s ease-in-out infinite alternate; }
		@-webkit-keyframes breathe { from { opacity: 0.18; -webkit-transform: scale(0.96); } to { opacity: 0.32; -webkit-transform: scale(1.04); } }
		@keyframes breathe { from { opacity: 0.18; transform: scale(0.96); } to { opacity: 0.32; transform: scale(1.04); } }
		#pair .bar { position: absolute; top: 6vmin; left: 7vmin; right: 7vmin; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
		#pair .brand { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 2.6vmin; letter-spacing: -0.01em; color: #e4e4e7; }
		#pair .brand svg { width: 4.4vmin; height: 4.4vmin; -webkit-margin-end: 1.4vmin; margin-inline-end: 1.4vmin; }
		#pair .brand .app { font-weight: 600; }
		#pair .where { font-size: 2vmin; color: #71717a; }
		#pair .page { position: absolute; top: 0; left: 7vmin; right: 7vmin; bottom: 0; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
		#pair .words { max-width: 62%; }
		#pair h1 { margin: 0; font-size: 7.2vmin; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em; }
		#pair .how { margin-top: 2.6vmin; font-size: 2.6vmin; line-height: 1.5; color: #a1a1aa; max-width: 60vmin; }
		#pair .code { display: -webkit-flex; display: flex; direction: ltr; margin-top: 7vmin; font-size: 16vmin; line-height: 1; font-weight: 500; letter-spacing: -0.02em; }
		#pair .code span { display: block; width: 0.62em; text-align: center; opacity: 0; -webkit-animation: up 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; animation: up 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
		#pair .code span.gap { width: 0.32em; }
		@-webkit-keyframes up { from { opacity: 0; -webkit-transform: translateY(0.25em); } to { opacity: 1; -webkit-transform: none; } }
		@keyframes up { from { opacity: 0; transform: translateY(0.25em); } to { opacity: 1; transform: none; } }
		#pair .wait { position: relative; margin-top: 5vmin; width: 40vmin; height: 0.3vmin; background: rgba(255, 255, 255, 0.1); overflow: hidden; border-radius: 0.3vmin; }
		#pair .wait i { position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: #fafafa; border-radius: 0.3vmin; -webkit-animation: wait 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; animation: wait 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
		@-webkit-keyframes wait { from { -webkit-transform: translateX(-100%); } to { -webkit-transform: translateX(340%); } }
		@keyframes wait { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
		#pair .scan { text-align: center; -webkit-animation: in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; animation: in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
		#pair .scan-code { width: 30vmin; height: 30vmin; padding: 2.2vmin; background: #fff; border-radius: 2.4vmin; }
		#pair .scan-code svg { display: block; width: 100%; height: 100%; }
		#pair .scan p { margin: 2.4vmin 0 0; font-size: 2vmin; color: #71717a; }
		#pair .foot { position: absolute; left: 7vmin; bottom: 6vmin; font-size: 2vmin; color: #52525b; direction: ltr; }
		@-webkit-keyframes in { from { opacity: 0; -webkit-transform: translateY(2vmin) scale(0.98); } to { opacity: 1; -webkit-transform: none; } }
		@keyframes in { from { opacity: 0; transform: translateY(2vmin) scale(0.98); } to { opacity: 1; transform: none; } }
		/* each part comes in on its own, so the parts around it can still leave */
		#pair .brand, #pair .where, #pair h1, #pair .how, #pair .wait, #pair .foot span { -webkit-animation: in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; animation: in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
		#pair .how { -webkit-animation-delay: 0.08s; animation-delay: 0.08s; }
		#pair .wait { -webkit-animation-delay: 0.6s; animation-delay: 0.6s; }
		@media (orientation: portrait) {
			#pair .page { -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
			#pair .words { max-width: none; }
			#pair .how { margin-left: auto; margin-right: auto; }
			#pair .code { -webkit-justify-content: center; justify-content: center; }
			#pair .wait { margin-left: auto; margin-right: auto; }
			#pair .scan { margin-top: 9vmin; }
		}

		/* paired: what was there leaves, a tick arrives, then the screen's name */
		#pair .bar, #pair .page, #pair .foot { -webkit-transition: opacity 0.5s ease, -webkit-transform 0.5s ease; transition: opacity 0.5s ease, transform 0.5s ease; }
		#pair.linking .bar, #pair.linking .page, #pair.linking .foot { opacity: 0; -webkit-transform: translateY(-2vmin); transform: translateY(-2vmin); }
		#pair .done { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; visibility: hidden; }
		#pair.linking .done { visibility: visible; }
		#pair .tick { position: relative; width: 14vmin; height: 14vmin; border-radius: 50%; background: var(--accent); opacity: 0; -webkit-transform: scale(0.5); transform: scale(0.5); -webkit-transition: opacity 0.4s ease 0.45s, -webkit-transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s; transition: opacity 0.4s ease 0.45s, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s; }
		#pair .tick svg { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; opacity: 0; -webkit-transform: scale(0.6); transform: scale(0.6); -webkit-transition: opacity 0.3s ease 0.8s, -webkit-transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s; transition: opacity 0.3s ease 0.8s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s; }
		#pair .tick b { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 0.3vmin solid var(--accent); opacity: 0; }
		#pair.linking .tick, #pair.linking .tick svg { opacity: 1; -webkit-transform: none; transform: none; }
		#pair.linking .tick b { -webkit-animation: ripple 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s 1 both; animation: ripple 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s 1 both; }
		@-webkit-keyframes ripple { from { opacity: 0.7; -webkit-transform: scale(1); } to { opacity: 0; -webkit-transform: scale(2.2); } }
		@keyframes ripple { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(2.2); } }
		#pair .done .t, #pair .done .s { opacity: 0; -webkit-transform: translateY(1.5vmin); transform: translateY(1.5vmin); -webkit-transition: opacity 0.6s ease 1.1s, -webkit-transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s; transition: opacity 0.6s ease 1.1s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s; }
		#pair .done .t { margin-top: 5vmin; font-size: 5.4vmin; font-weight: 600; letter-spacing: -0.03em; }
		#pair .done .s { margin-top: 1.4vmin; font-size: 2.6vmin; color: #a1a1aa; -webkit-transition-delay: 1.25s; transition-delay: 1.25s; }
		#pair.linking .done .t, #pair.linking .done .s { opacity: 1; -webkit-transform: none; transform: none; }
		#pair.leaving { opacity: 0; -webkit-transition: opacity 0.9s ease; transition: opacity 0.9s ease; }
		#pair:not(.hidden) ~ #status #hint { display: none !important; }
		#status { position: fixed; z-index: 40; bottom: 1.5vmin; right: 1.5vmin; font-size: 1.6vmin; color: #9ca3af; }
		#status .dot { display: inline-block; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #f59e0b; vertical-align: middle; }
	</style>
</head>
<body>
	<div id="frame">
		<div id="slides" class="fill"></div>
		<div id="widgets" class="fill"></div>
	</div>
	<div id="pair" class="over hidden">
		<div class="light"></div>
		<div class="bar">
			<div class="brand">{{ mark }}<span>One</span><span class="app">Display</span></div>
			<div class="where" id="pair-where"></div>
		</div>
		<div class="page">
			<div class="words">
				<h1 id="pair-title"></h1>
				<div class="how" id="pair-how"></div>
				<div class="code" id="code"></div>
				<div class="wait"><i></i></div>
			</div>
			<div class="scan"><div class="scan-code" id="pair-qr"></div><p id="pair-scan"></p></div>
		</div>
		<div class="foot"><span id="pair-host"></span></div>
		<div class="done">
			<div class="tick"><b></b><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
			<div class="t" id="pair-done"></div>
			<div class="s" id="pair-what"></div>
		</div>
	</div>
	<div id="radio" class="over hidden"><div class="light"></div><div class="radio-in"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div id="radio-zone" class="eyebrow"></div><div id="radio-now"></div></div></div>
	<div id="saver" class="over hidden"><div class="drift" id="drift"><div id="saver-clock"></div><img id="saver-logo" class="hidden" alt=""></div></div>
	<div id="ticket" class="over hidden">
		<div class="a" id="ticket-label"></div>
		<div class="t" id="ticket-number"></div>
		<div class="a" id="ticket-ahead"></div>
	</div>
	<div id="alert" class="over hidden"></div>
	<div id="dark" class="over hidden"></div>
	<div id="status"><span id="hint" class="hidden"></span> <span id="offline" class="dot hidden"></span></div>
	<audio id="music" preload="auto"></audio>
	<script>
		window.ONE_TV = { csrf: "{{ csrf_token or '' }}", words: {{ words_json }}, preview: {{ preview_json }}, socket: {{ socket_json }}, radio: {{ 1 if radio else 0 }} };
	</script>
	<link rel="stylesheet" href="/assets/frappe/css/fonts/inter/inter.css">
	<link rel="stylesheet" href="/assets/onedesk/slide/fonts.css">
	<link rel="stylesheet" href="/api/method/onedesk.one_slide.fonts.css">
	<script src="/assets/onedesk/js/one_slide/play.js"></script>
	<script src="/assets/onedesk/js/one_display/tv.js"></script>
</body>
</html>
