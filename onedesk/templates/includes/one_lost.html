{%- set core = lost_core or "one" -%}
<div class="one-lost__art" aria-hidden="true">
	{%- if lost_code %}<span class="one-lost__digit">{{ lost_code[0] }}</span>{% endif %}
	<span class="one-lost__ring">
		<span class="one-lost__orbit"><i></i><i></i><i></i><i></i></span>
		<svg viewBox="19 19 154 154" fill="none">
			<defs>
				<linearGradient id="one-lost-band" x1="28" y1="28" x2="164" y2="164" gradientUnits="userSpaceOnUse">
					<stop offset="0" style="stop-color: var(--one-suite-1)"/><stop offset=".35" style="stop-color: var(--one-suite-2)"/>
					<stop offset=".68" style="stop-color: var(--one-suite-3)"/><stop offset="1" style="stop-color: var(--one-suite-4)"/>
				</linearGradient>
				<radialGradient id="one-lost-core" cx="96" cy="96" r="54" gradientUnits="userSpaceOnUse">
					<stop offset="0" style="stop-color: var(--one-suite-core-glow)"/><stop offset="1" style="stop-color: var(--one-suite-core)"/>
				</radialGradient>
			</defs>
			<circle class="one-lost__band" cx="96" cy="96" r="68" stroke="url(#one-lost-band)" stroke-width="18"/>
			<circle cx="96" cy="96" r="52" fill="url(#one-lost-core)"/>
			<circle cx="96" cy="96" r="52" style="stroke: var(--one-suite-glint)" stroke-opacity=".12" stroke-width="1.5"/>
			<g class="one-lost__core one-lost__core--{{ core }}" style="stroke: var(--one-suite-glint)" stroke-linecap="round" stroke-linejoin="round">
			{%- if core == "empty" %}
			{%- elif core == "check" %}
				<path d="M74 97l15 15 30-32" stroke-width="12"/>
			{%- else %}
				<path d="M86 78l10-8v52M84 122h24" stroke-width="12"/>
			{%- endif %}
			</g>
		</svg>
	</span>
	{%- if lost_code %}<span class="one-lost__digit">{{ lost_code[2] }}</span>{% endif %}
</div>
