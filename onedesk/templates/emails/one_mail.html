<div dir="{{ 'rtl' if rtl else 'ltr' }}"{% if ones %} data-one-from="one"{% endif %} style="text-align: {{ 'right' if rtl else 'left' }};">
<h1 class="one-title">{{ subject }}</h1>
{%- if message %}
<div class="one-text">{{ message }}</div>
{%- endif %}
{%- if link and button %}
<div class="one-action"><a class="one-button" href="{{ link }}">{{ button }}</a></div>
{%- endif %}
{%- if reason %}
<div class="one-reason">{{ reason }}</div>
{%- endif %}
</div>
