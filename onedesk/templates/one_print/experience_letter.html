{%- set b = one_print_block(doc, "experience_letter") -%}
{%- if b %}
<div style="font-size:12px;color:#111827;line-height:1.65">
	<div style="text-align:right;color:#6b7280;margin-bottom:18px">{{ b.date|e }}</div>
	<div style="font-weight:600;margin-bottom:12px">{{ b.greeting|e }}</div>
	<p style="margin:0 0 14px">{{ b.opening|e }}</p>
	{%- if b.wish %}<p style="margin:0 0 14px">{{ b.wish|e }}</p>{% endif %}
	<p style="margin:0">{{ b.closing|e }}</p>
</div>
{%- endif %}
