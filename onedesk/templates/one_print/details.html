{%- set b = one_print_block(doc, "details") -%}
{%- if b %}
<table style="width:100%;border-collapse:collapse;font-size:11px">
	{%- for label, value in b.rows %}
	<tr>
		<td style="padding:5px 0;border-bottom:1px solid #f0f1f3;color:#6b7280">{{ label|e }}</td>
		<td style="padding:5px 0;border-bottom:1px solid #f0f1f3;text-align:right;color:#111827;font-weight:500">{{ value|e }}</td>
	</tr>
	{%- endfor %}
</table>
{%- endif %}
