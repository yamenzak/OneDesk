{%- set b = one_print_block(doc, "total") -%}
{%- if b %}
<table style="width:48%;margin-left:52%;border-collapse:collapse;font-size:15px">
	<tr>
		<td style="padding:8px 0;border-bottom:2px solid #111827;font-weight:700;color:#111827">{{ b.label|e }}</td>
		<td style="padding:8px 0;border-bottom:2px solid #111827;text-align:right;font-weight:700;color:#111827;white-space:nowrap">{{ b.value|e }}</td>
	</tr>
</table>
{%- endif %}
