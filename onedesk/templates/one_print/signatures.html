{%- set b = one_print_block(doc, "signatures") -%}
{%- if b %}
{%- if b.pledge %}<p style="font-size:12px;color:#374151;margin:0 0 20px">{{ b.pledge|e }}</p>{% endif %}
<table style="width:100%;border-collapse:collapse;font-size:12px;color:#111827;margin-bottom:24px">
	<tr>
		{%- for side in b.sides %}
		<td style="width:50%;vertical-align:top;padding:{{ '0 24px 0 0' if loop.first else '0 0 0 24px' }}">
			<div style="font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:#6b7280">{{ side.heading|e }}</div>
			<div style="font-weight:600;margin-top:4px;min-height:18px">{{ (side.name or "")|e }}</div>
			<div style="border-bottom:1px solid #111827;height:44px"></div>
			<table style="width:100%;border-collapse:collapse;font-size:10px;color:#6b7280">
				<tr><td style="padding-top:4px">{{ b.signature|e }}</td><td style="padding-top:4px;text-align:right">{{ b.date|e }}</td></tr>
			</table>
		</td>
		{%- endfor %}
	</tr>
</table>
{%- endif %}
