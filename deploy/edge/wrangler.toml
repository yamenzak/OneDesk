name = "one-tenant-router"
main = "worker.js"
compatibility_date = "2025-01-01"

# Every workspace, one route. There is no per-tenant route and no per-tenant DNS
# record: a proxied wildcard A record on *.t.4dl.app plus this is the whole of
# it. Point the record at 192.0.2.1 — it is never dialled, because the Worker
# answers before the origin is consulted.
routes = [
  { pattern = "*.t.4dl.app/*", zone_name = "4dl.app" }
]

# Written by the admin site as each workspace is provisioned: the key is the
# slug, the value is the press site name. Put the real id here after creating
# the namespace, and the same id into One Admin Settings.
[[kv_namespaces]]
binding = "SITES"
id = "replace-me"
