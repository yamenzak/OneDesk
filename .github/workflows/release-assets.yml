name: Release assets

on:
  workflow_dispatch:
  schedule:
    - cron: "10 20 * * 2"

concurrency:
  group: release-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Already built?
        id: built
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ASSETS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ASSETS_SECRET }}
          AWS_DEFAULT_REGION: auto
        run: |
          if aws s3api head-object --endpoint-url "${{ secrets.R2_ENDPOINT }}" --bucket "${{ secrets.R2_ASSETS_BUCKET }}" --key "releases/$GITHUB_SHA.json" > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.built.outputs.yes != 'true'
        with:
          node-version: "24"

      - name: Install Pilot
        if: steps.built.outputs.yes != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors https://raw.githubusercontent.com/frappe/pilot/develop/install.sh -o /tmp/pilot.sh
          chmod 644 /tmp/pilot.sh
          sudo env PATH="$PATH" PILOT_VERSION=v0.0.99-pre-alpha sh /tmp/pilot.sh
          for attempt in 1 2 3 4; do
            sudo -iu frappe env PATH="/home/frappe/.local/bin:$PATH" PILOT_VERSION=v0.0.99-pre-alpha bash /tmp/pilot.sh && break
            [ "$attempt" = 4 ] && exit 1
            sleep 30
          done
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/onedesk
          sudo chown -R frappe:frappe /tmp/onedesk

      - name: Build and publish
        if: steps.built.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ASSETS_BUCKET: ${{ secrets.R2_ASSETS_BUCKET }}
          R2_ASSETS_KEY: ${{ secrets.R2_ASSETS_KEY }}
          R2_ASSETS_SECRET: ${{ secrets.R2_ASSETS_SECRET }}
          ONE_ADMIN_URL: ${{ secrets.ONE_ADMIN_URL }}
          ONE_RELEASE_SECRET: ${{ secrets.ONE_RELEASE_SECRET }}
        run: |
          sudo -iu frappe env PATH="/home/frappe/pilot/bin:/home/frappe/.local/bin:$PATH" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GH_TOKEN="$GH_TOKEN" RELEASE_BRANCH="$RELEASE_BRANCH" R2_ENDPOINT="$R2_ENDPOINT" R2_ASSETS_BUCKET="$R2_ASSETS_BUCKET" \
            R2_ASSETS_KEY="$R2_ASSETS_KEY" R2_ASSETS_SECRET="$R2_ASSETS_SECRET" ONE_ADMIN_URL="$ONE_ADMIN_URL" ONE_RELEASE_SECRET="$ONE_RELEASE_SECRET" \
            bash /tmp/onedesk/deploy/release/build.sh
