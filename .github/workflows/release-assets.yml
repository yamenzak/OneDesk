name: Release assets

on:
  workflow_dispatch:
  schedule:
    - cron: "10 20 * * 2"
  push:
    branches: ["release/**"]

concurrency:
  group: release-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Pilot
        run: |
          curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors https://raw.githubusercontent.com/frappe/pilot/develop/install.sh -o "$RUNNER_TEMP/pilot.sh"
          sudo env PATH="$PATH" BENCH_USER="$USER" PILOT_VERSION=v0.0.99-pre-alpha sh "$RUNNER_TEMP/pilot.sh"
          for attempt in 1 2 3 4; do
            PILOT_VERSION=v0.0.99-pre-alpha bash "$RUNNER_TEMP/pilot.sh" && break
            [ "$attempt" = 4 ] && exit 1
            sleep 30
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/pilot/bin" >> "$GITHUB_PATH"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ASSETS_BUCKET: ${{ secrets.R2_ASSETS_BUCKET }}
          R2_ASSETS_KEY: ${{ secrets.R2_ASSETS_KEY }}
          R2_ASSETS_SECRET: ${{ secrets.R2_ASSETS_SECRET }}
        run: deploy/release/build.sh
