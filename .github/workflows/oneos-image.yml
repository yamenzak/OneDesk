name: OneOS image

on:
  push:
    branches: [main]
    paths:
      - deploy/oneos/image/**
      - .github/workflows/oneos-image.yml
  workflow_dispatch:

concurrency:
  group: oneos-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Secrets set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_CONTAINERS_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. Connect GitHub in production's OneAdmin, then press Set Up Again on its Cloudflare tab (deploy/oneos/README.md, The image)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Tag
        id: tag
        run: echo "tag=$(git rev-parse HEAD:deploy/oneos/image)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --pull --platform linux/amd64 -t "one-os:${{ steps.tag.outputs.tag }}" deploy/oneos/image

      - name: Push to Cloudflare's registry
        working-directory: deploy/oneos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm install --no-audit --no-fund
          npx wrangler containers push "one-os:${{ steps.tag.outputs.tag }}"
          echo "Pushed one-os:${{ steps.tag.outputs.tag }} to Cloudflare's registry" >> "$GITHUB_STEP_SUMMARY"
