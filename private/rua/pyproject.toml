[project]
name = "rua"
authors = [{ name = "One", email = "hello@4dl.app" }]
description = "Rua Company on One: its setup, and its records brought over from the old app"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
onedesk = ">=0.0.1"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "RUF001",
    "RUF002",
    "RUF003",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
